let _importData = null;   // for spreadsheet import preview

// ---- GAS RPC helper ----
function rpc(action, payload) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(r => resolve(r))
      .withFailureHandler(e => reject(e))
      [action](payload);
  });
}

// ---- GAS direct call via doPost (for complex payloads) ----
function gasPost(action, payload) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(res => resolve(res))
      .withFailureHandler(err => reject(err))
      ._gasDispatch(action, payload);
  });
}

// Toast
function toast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  clearTimeout(t._to);
  t._to = setTimeout(() => { t.className = 'toast'; }, 3500);
}

// Loading
function loading(msg = '処理中…') { toast(msg); }

// ---- Tab navigation ----
document.querySelectorAll('.nav-item').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    const tab = 'tab-' + el.dataset.tab;
    const panel = document.getElementById(tab);
    if (panel) panel.classList.add('active');
    onTabActivate(el.dataset.tab);
  });
});

// ---- Sub-tab navigation ----
document.querySelectorAll('.sub-tab').forEach(el => {
  el.addEventListener('click', () => {
    const parent = el.closest('.tab-panel');
    parent.querySelectorAll('.sub-tab').forEach(e => e.classList.remove('active'));
    parent.querySelectorAll('.sub-panel').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    const sub = document.getElementById('sub-' + el.dataset.sub);
    if (sub) sub.classList.add('active');
  });
});

function onTabActivate(tab) {
  if (tab === 'dashboard')  loadDashboard();
  if (tab === 'ocr')        loadSources();
  if (tab === 'bom')        loadBOMData();
  if (tab === 'crm')        loadCRMData();
  if (tab === 'meetings')   loadMeetings();
  if (tab === 'graph')      loadGraph();
}

function loadDashboard() {
  google.script.run.withSuccessHandler(data => {
    renderStats(data);
  }).getDashboardData();

  google.script.run.withSuccessHandler(crm => {
    renderCRMFunnel(crm.phaseStats);
    renderSalesStats(crm.salesStats);
    renderRecentActivities(crm.recentActivities);
  }).getCRMDashboard();
}

function renderStats(data) {
  const grid = document.getElementById('stats-grid');
  const items = [
    { label: 'ナレッジ文書', value: data.sourcesCount, cls: '' },
    { label: '機種マスタ', value: data.modelsCount, cls: '' },
    { label: '基板マスタ', value: data.boardsCount, cls: '' },
    { label: '部品マスタ', value: data.partsCount, cls: 'accent-teal' },
    { label: '見積書', value: data.quotesCount, cls: 'accent-amber' },
    { label: '商談議事録', value: data.meetingsCount, cls: '' },
    { label: 'CRM案件', value: data.dealsCount, cls: 'accent-green' },
    { label: '顧客会社', value: data.companiesCount, cls: '' },
  ];
  grid.innerHTML = items.map(i => `
    <div class="stat-card ${i.cls}">
      <div class="stat-num">${i.value}</div>
      <div class="stat-label">${i.label}</div>
    </div>`).join('');
}

function renderCRMFunnel(phaseStats) {
  const phaseOrder = ['アプローチ','提案','見積提示','交渉','受注','失注'];
  const maxAmt = Math.max(...phaseOrder.map(p => (phaseStats[p] || {}).amount || 0));
  const el = document.getElementById('crm-funnel');
  el.innerHTML = phaseOrder.map(ph => {
    const s = phaseStats[ph] || { count: 0, amount: 0 };
    const pct = maxAmt > 0 ? Math.round(s.amount / maxAmt * 100) : 0;
    return `<div class="funnel-bar">
      <span class="funnel-label">${ph}</span>
      <div class="funnel-track"><div class="funnel-fill" style="width:${pct}%"></div></div>
      <span class="funnel-count">${s.count}件</span>
    </div>`;
  }).join('');
}

function renderSalesStats(salesStats) {
  const el = document.getElementById('sales-stats');
  const rows = Object.entries(salesStats).sort((a,b) => b[1].amount - a[1].amount).slice(0, 8);
  el.innerHTML = rows.map(([rep, s]) => `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05)">
      <span style="font-size:13px;color:var(--text1)">${rep}</span>
      <span style="font-size:12px;color:var(--text3)">${s.deals}件 ¥${(s.amount/10000).toFixed(0)}万</span>
    </div>`).join('') || '<span style="color:var(--text3);font-size:12px">データなし</span>';
}

function renderRecentActivities(activities) {
  const el = document.getElementById('recent-activities');
  el.innerHTML = activities.slice(0, 10).map(a => `
    <div style="display:flex;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05)">
      <span class="phase-badge phase-${a['種別'] || ''}">` + (a['種別'] || '活動') + `</span>
      <span style="font-size:12px;color:var(--text2);flex:1">` + String(a['内容']||'').substring(0,60) + `</span>
      <span style="font-size:11px;color:var(--text3)">` + String(a['日時']||'').substring(0,10) + `</span>
    </div>`).join('') || '<span style="color:var(--text3);font-size:12px">活動なし</span>';
}

function loadSources() {

    const rows = data.sources ? data.sources.rows : [];

    const tagIdx  = headers.indexOf('タグ');
    const sumIdx  = headers.indexOf('AI要約');
    const dtIdx   = headers.indexOf('連携日時');

    tbody.innerHTML = rows.map(r => `<tr>
      <td><a href="${r[urlIdx]}" target="_blank" style="color:var(--accent2)">${esc(r[nameIdx])}</a></td>
      <td><span class="phase-badge">${esc(r[catIdx])}</span></td>

      <td class="truncate">${esc(r[sumIdx])}</td>

    </tr>`).join('') || '<tr><td colspan="6" style="color:var(--text3);text-align:center;padding:20px">データなし</td></tr>';
  }).getAllDataForTables();
}

function renderBOMTree(tree) {
  const m = tree.model;
  const boardsHtml = tree.boards.map(b => {
    const bd = b.boardDetail || {};
    const partsHtml = b.parts.map(p => {
      const pd = p.partDetail || {};
      return `<div class="bom-tree-part">${esc(pd['部品名']||'?')} (部番:${esc(pd['部品番号']||'')}) × ${p['数量']} — ¥${numFmt(pd['単価']||0)}</div>`;
    }).join('');
    return `<div class="bom-tree-board">
      <span class="board-name">⬡ ${esc(bd['基板名']||b['基板ID'])} [${esc(bd['リビジョン']||'')}]</span> × ${b['数量']}
      <div class="bom-tree-parts">${partsHtml}</div>
    </div>`;
  }).join('');
  return `<div class="bom-tree">
    <div class="bom-tree-model">
      <div class="model-name">◆ ${esc(m['機種名'])} [${esc(m['型番']||'')}]</div>
      <div style="font-size:12px;color:var(--text3);margin-top:4px">販売価格: ¥${numFmt(m['販売価格']||0)} / 原価: ¥${numFmt(m['原価']||0)}</div>
    </div>
    <div class="bom-tree-boards">${boardsHtml || '<span style="color:var(--text3);font-size:12px">基板未登録</span>'}</div>
  </div>`;
}

function runAI() {
  const query = document.getElementById('ai-query').value.trim();

  const chat = document.getElementById('ai-chat');
  chat.innerHTML += `<div class="chat-bubble user">${esc(query)}</div>`;
  chat.innerHTML += `<div class="chat-bubble ai" id="ai-loading">⋯ 考え中</div>`;
  chat.scrollTop = chat.scrollHeight;

  google.script.run
    .withSuccessHandler(r => {
      document.getElementById('ai-loading').remove();
      chat.innerHTML += `<div class="chat-bubble ai">${esc(r)}</div>`;
      chat.scrollTop = chat.scrollHeight;
    })
    .withFailureHandler(e => {
      document.getElementById('ai-loading').remove();
      chat.innerHTML += `<div class="chat-bubble ai" style="color:var(--red)">エラー: ${esc(e.message)}</div>`;
    })
    .processAIQuery(query, mode);

  document.getElementById('ai-query').value = '';
}

function renderGraph(data) {
  const container = document.getElementById('graph-container');
  container.innerHTML = '';
  const colorMap = {
    model:   { bg: '#6366f1', border: '#818cf8', text: '#fff' },
    board:   { bg: '#14b8a6', border: '#2dd4bf', text: '#fff' },
    meeting: { bg: '#f59e0b', border: '#fbbf24', text: '#000' },
    note:    { bg: '#10b981', border: '#34d399', text: '#fff' },
    source:  { bg: '#8b5cf6', border: '#a78bfa', text: '#fff' },
    deal:    { bg: '#ef4444', border: '#f87171', text: '#fff' },
  };
  const nodes = new vis.DataSet(data.nodes.map(n => {
    const c = colorMap[n.type] || { bg: '#666', border: '#999', text: '#fff' };
    return { id: n.id, label: n.label, color: { background: c.bg, border: c.border }, font: { color: c.text, size: 12 }, shape: 'box', borderWidth: 1 };
  }));
  const edges = new vis.DataSet(data.edges.map(e => ({
    id: e.id, from: e.from, to: e.to, label: e.label,
    color: { color: '#3f4668' }, font: { color: '#9ba3c4', size: 10 }, arrows: 'to', smooth: { type: 'continuous' }
  })));
  const network = new vis.Network(container, { nodes, edges }, {
    layout: { improvedLayout: true },
    physics: { stabilization: { iterations: 100 }, barnesHut: { gravitationalConstant: -8000 } },
    interaction: { dragNodes: true, zoomView: true, navigationButtons: true },
    nodes: { borderWidth: 1, borderWidthSelected: 2 },
  });
  _graphNetwork = network;

  const legendEl = document.getElementById('graph-legend');
  legendEl.innerHTML = Object.entries(colorMap).map(([type, c]) => `
    <div class="legend-item"><div class="legend-dot" style="background:${c.bg}"></div>${type}</div>`).join('');
}

function doCSVImport() {
  const csvText = document.getElementById('csv-text').value.trim();
  const type = val('csv-import-type');
  if (!csvText) { toast('CSVテキストを入力してください', 'error'); return; }
  const lines = csvText.split('\n').map(l => l.trim()).filter(l => l);
  if (lines.length < 2) { toast('データが少なすぎます (最低2行)', 'error'); return; }
  const headers = lines[0].split(',').map(h => h.trim());
  const rows = lines.slice(1).map(l => l.split(',').map(c => c.trim()));
  loading('インポート中…');
  google.script.run
    .withSuccessHandler(r => { toast('✅ ' + r, 'success'); document.getElementById('csv-text').value = ''; loadBOMData(); })
    .withFailureHandler(e => toast('❌ ' + e.message, 'error'))
    .importBulkData(type, headers, rows);
}

function setupDB() {
  if (!confirm('データベースの初期化を実行しますか？（既存データは保持されます）')) return;
  loading('初期化中…');
  google.script.run
    .withSuccessHandler(r => toast('✅ ' + r, 'success'))
    .withFailureHandler(e => toast('❌ ' + e.message, 'error'))
    .setupDatabase();
}

function deleteRow(sheetName, id) {
  if (!confirm('削除しますか？')) return;
  google.script.run
    .withSuccessHandler(r => { toast('✅ ' + r, 'success'); onTabActivate(document.querySelector('.nav-item.active').dataset.tab); })
    .withFailureHandler(e => toast('❌ ' + e.message, 'error'))
    .deleteRowData(sheetName, id);
}

function renderSimpleTable(tbodyId, sheetData, showCols, idCols) {
  const tbody = document.getElementById(tbodyId);
  if (!tbody) return;
  if (!sheetData || !sheetData.headers || !sheetData.rows) { tbody.innerHTML = '<tr><td colspan="99" style="color:var(--text3);text-align:center;padding:16px">データなし</td></tr>'; return; }
  const { headers, rows } = sheetData;
  const colIdxs = showCols.map(c => headers.indexOf(c));
  const idIdx = headers.indexOf(idCols[0]);
  tbody.innerHTML = rows.map(r => {
    const cells = colIdxs.map((ci, i) => {
      const raw = ci >= 0 ? String(r[ci] || '') : '';
      // フェーズのバッジ表示
      if (showCols[i] === 'フェーズ') return `<td><span class="phase-badge phase-${raw}">${esc(raw)}</span></td>`;
      if (showCols[i] === '金額' || showCols[i] === '合計金額' || showCols[i] === '販売価格' || showCols[i] === '単価') {
        const n = parseFloat(raw);
        return `<td>${isNaN(n) ? esc(raw) : '¥' + numFmt(n)}</td>`;
      }
      return `<td class="truncate">${esc(raw.substring(0,80))}</td>`;
    }).join('');
    const id = idIdx >= 0 ? r[idIdx] : '';
    return `<tr>${cells}<td><button class="btn-danger" onclick="deleteRow('${tbodyId.replace('-tbody','')}','${id}')">削除</button></td></tr>`;
  }).join('') || '<tr><td colspan="99" style="color:var(--text3);text-align:center;padding:16px">データなし</td></tr>';
}

function filterTable(tableId, keyword) {
  const table = document.getElementById(tableId);
  if (!table) return;
  const kw = keyword.toLowerCase();
  table.querySelectorAll('tbody tr').forEach(tr => {
    tr.style.display = tr.textContent.toLowerCase().includes(kw) ? '' : 'none';
  });
}

function val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function numval(id) { const v = parseFloat(val(id)); return isNaN(v) ? 0 : v; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function numFmt(n) { return Number(n).toLocaleString('ja-JP'); }
function clearInputs(ids) { ids.forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; }); }

// Enter key for AI
document.getElementById('ai-query').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) runAI();
});

// Init
window.addEventListener('load', () => { loadDashboard(); });
</script>
