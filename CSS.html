<style>
:root {
  --bg: #0d0f1a;
  --bg2: #131625;
  --bg3: #1a1e32;
  --surface: #1e2236;
  --surface2: #252a40;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text1: #e8eaf2;
  --text2: #9ba3c4;
  --text3: #5c6480;
  --accent: #6366f1;
  --accent2: #818cf8;
  --green: #10b981;
  --amber: #f59e0b;
  --red: #ef4444;
  --teal: #14b8a6;
  --sidebar-w: 220px;
  --radius: 10px;
  --radius-lg: 14px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif; background: var(--bg); color: var(--text1); font-size: 14px; line-height: 1.6; }

#app { display: flex; height: 100vh; overflow: hidden; }

/* --- Sidebar --- */
.sidebar {
  width: var(--sidebar-w);
  min-width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.sidebar-logo {
  padding: 20px 16px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border);
}
.logo-icon { font-size: 20px; color: var(--accent2); }
.logo-text { font-size: 15px; font-weight: 700; letter-spacing: 0.05em; color: var(--text1); }
.sidebar-nav { list-style: none; padding: 8px 0; flex: 1; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  cursor: pointer;
  color: var(--text2);
  font-size: 13px;
  border-radius: 0;
  transition: background 0.15s, color 0.15s;
  user-select: none;
}
.nav-item:hover { background: var(--surface); color: var(--text1); }
.nav-item.active { background: var(--surface2); color: var(--accent2); font-weight: 600; border-right: 2px solid var(--accent); }
.nav-icon { font-size: 12px; width: 16px; text-align: center; }
.sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }
.btn-setup {
  width: 100%;
  padding: 8px;
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--text2);
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 12px;
  transition: all 0.15s;
}
.btn-setup:hover { background: var(--surface); color: var(--text1); }

/* --- Main --- */
.main-content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  position: relative;
}

/* --- Page header --- */
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.page-header h1 { font-size: 20px; font-weight: 700; color: var(--text1); }

/* --- Tab panels --- */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* --- Sub tabs --- */
.sub-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0;
}
.sub-tab {
  padding: 8px 16px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text2);
  cursor: pointer;
  font-size: 13px;
  font-family: inherit;
  transition: all 0.15s;
  margin-bottom: -1px;
}
.sub-tab:hover { color: var(--text1); }
.sub-tab.active { color: var(--accent2); border-bottom-color: var(--accent); font-weight: 600; }
.sub-panel { display: none; }
.sub-panel.active { display: block; }

/* --- Cards --- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  margin-bottom: 16px;
}
.card h3 { font-size: 14px; font-weight: 600; color: var(--text2); margin-bottom: 14px; letter-spacing: 0.05em; text-transform: uppercase; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* --- Stats Grid --- */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
}
.stat-card.loading { color: var(--text3); font-size: 13px; padding: 20px; }
.stat-num { font-size: 28px; font-weight: 700; color: var(--accent2); }
.stat-label { font-size: 11px; color: var(--text3); margin-top: 4px; letter-spacing: 0.05em; }
.stat-card.accent-green .stat-num { color: var(--green); }
.stat-card.accent-amber .stat-num { color: var(--amber); }
.stat-card.accent-teal .stat-num { color: var(--teal); }

/* --- Dashboard row --- */
.dashboard-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

/* --- Funnel --- */
.funnel-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.funnel-label { font-size: 12px; color: var(--text2); width: 80px; text-align: right; }
.funnel-track { flex: 1; height: 20px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
.funnel-fill { height: 100%; border-radius: 4px; transition: width 0.6s ease; background: var(--accent); }
.funnel-count { font-size: 11px; color: var(--text3); width: 30px; }

/* --- Forms --- */
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 12px; color: var(--text3); margin-bottom: 4px; }
.form-row { display: flex; gap: 12px; }
.form-group.half { flex: 1; }
.input {
  width: 100%;
  padding: 8px 12px;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  color: var(--text1);
  font-size: 13px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s;
}
.input:focus { border-color: var(--accent); }
.input::placeholder { color: var(--text3); }
select.input { cursor: pointer; }
textarea.input { resize: vertical; }

/* --- Buttons --- */
.btn-primary {
  padding: 9px 18px;
  background: var(--accent);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  font-size: 13px;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
}
.btn-primary:hover { opacity: 0.85; }
.btn-primary:active { transform: scale(0.98); }
.btn-primary.full-width { width: 100%; }
.btn-danger {
  padding: 5px 10px;
  background: transparent;
  border: 1px solid var(--red);
  border-radius: 6px;
  color: var(--red);
  font-size: 11px;
  cursor: pointer;
}

/* --- Tables --- */
.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.table-wrap { overflow-x: auto; max-height: 400px; overflow-y: auto; }
.data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.data-table th {
  background: var(--bg3);
  color: var(--text3);
  padding: 8px 10px;
  text-align: left;
  font-weight: 600;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 1;
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.data-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  color: var(--text1);
  vertical-align: top;
}
.data-table tr:hover td { background: var(--bg3); }
.data-table td.truncate { max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* --- AI Chat --- */
.ai-mode-selector { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
.radio-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text2); cursor: pointer; }
.radio-label input { accent-color: var(--accent); }
.ai-input-row { display: flex; gap: 10px; align-items: flex-end; }
.ai-query { flex: 1; }
.btn-ai {
  padding: 9px 20px;
  background: var(--accent);
  border: none;
  border-radius: var(--radius);
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
  height: fit-content;
}
.ai-chat { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.chat-bubble {
  padding: 14px 16px;
  border-radius: var(--radius-lg);
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
}
.chat-bubble.user { background: var(--surface2); align-self: flex-end; max-width: 80%; color: var(--text1); }
.chat-bubble.ai { background: var(--bg2); border: 1px solid var(--border); align-self: flex-start; max-width: 90%; color: var(--text1); }

/* --- Graph --- */
.graph-legend { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
.legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }

/* --- BOM Tree --- */
.bom-tree { font-size: 13px; }
.bom-tree-model { background: var(--bg3); border: 1px solid var(--accent); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 8px; }
.bom-tree-model .model-name { font-weight: 700; color: var(--accent2); }
.bom-tree-boards { padding-left: 20px; border-left: 2px solid var(--border2); margin-left: 10px; }
.bom-tree-board { margin: 6px 0; }
.bom-tree-board .board-name { color: var(--teal); font-weight: 600; }
.bom-tree-parts { padding-left: 16px; }
.bom-tree-part { color: var(--text2); font-size: 12px; padding: 2px 0; }
.bom-tree-part::before { content: '• '; color: var(--text3); }

/* --- Phase badge --- */
.phase-badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 600;
}
.phase-アプローチ { background: rgba(99,102,241,0.15); color: var(--accent2); }
.phase-提案 { background: rgba(20,184,166,0.15); color: var(--teal); }
.phase-見積提示 { background: rgba(245,158,11,0.15); color: var(--amber); }
.phase-交渉 { background: rgba(239,68,68,0.15); color: var(--red); }
.phase-受注 { background: rgba(16,185,129,0.2); color: var(--green); }
.phase-失注 { background: rgba(100,100,100,0.2); color: var(--text3); }

/* --- Toast --- */
.toast {
  position: fixed;
  top: 20px;
  right: 20px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 12px 20px;
  color: var(--text1);
  font-size: 13px;
  z-index: 9999;
  opacity: 0;
  transform: translateY(-10px);
  transition: all 0.3s;
  pointer-events: none;
  max-width: 340px;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { border-color: var(--green); }
.toast.error { border-color: var(--red); }

/* --- Hint text --- */
.hint { font-size: 12px; color: var(--text3); margin-bottom: 12px; line-height: 1.6; }
code { background: var(--bg3); padding: 2px 5px; border-radius: 4px; font-family: monospace; font-size: 11px; color: var(--accent2); }

/* --- Result box --- */
.result-box {
  margin-top: 12px;
  padding: 12px;
  background: var(--bg3);
  border-radius: var(--radius);
  font-size: 12px;
  color: var(--text2);
  white-space: pre-wrap;
}

/* --- Scrollbar --- */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 10px; }

@media (max-width: 900px) {
  .two-col { grid-template-columns: 1fr; }
  .dashboard-row { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .sidebar { width: 48px; min-width: 48px; }
  .logo-text, .nav-item span:last-child, .sidebar-footer { display: none; }
  .main-content { padding: 12px; }
}
</style>
